services:

  backend:
    build:
      context: ./canvara-backend
      dockerfile: Dockerfile
    container_name: canvara-backend
    ports:
      - "3001:8080"
    environment:
      # Database — point to your external MySQL (RDS, PlanetScale, etc.)
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # S3 Storage
      CANVARA_S3_BUCKET: canvara-artwork-uploads
      CANVARA_S3_REGION: us-east-1

      # CORS Config
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # Spring profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  canvara-ai:
    build:
      context: ./canvara-ai
      dockerfile: Dockerfile
    container_name: canvara-ai
    ports:
      - "8001:8000"
    env_file:
      - ./.env
    environment:
      BACKEND_URL: http://canvara-backend:8080
      DATABASE_URL: ${DB_URL}
      DATABASE_USER: ${DB_USERNAME}
      DATABASE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - backend

  frontend:
    build:
      context: ./canvara-frontend
      dockerfile: Dockerfile
      args:
        # At build time, frontend proxies /api/* via nginx to backend container
        # so we use the nginx proxy — no need to expose backend URL to browser
        VITE_API_BASE_URL: ""
    container_name: canvara-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

